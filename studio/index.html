<main><h1>Assay <em>Evidence Studio</em></h1><p class="intro">Explore how a biological measurement becomes a model claim. Choose a case, inspect its evidence and export the figure.</p>
<form class="ask" id="ask"><input aria-label="Find an evidence view" id="query" placeholder="Try “compare enzyme plateaus” or “show cytology errors”"><button>Find view</button></form><p id="status" role="status"></p>
