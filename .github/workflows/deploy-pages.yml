name: Verify and deploy Assay Evidence Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run browser-module unit tests and syntax checks
        run: |
          node studio/test-fit.cjs
          node studio/test-simulation.cjs
          node studio/test-tomography.cjs
          node studio/test-evidence-records.cjs
          node studio/test-studio-config.cjs
          node studio/test-studio-pages.cjs
          for f in studio/*.js; do
            node --check "$f"
          done

      - name: Install Python test dependencies
        run: python -m pip install -r NucleusAudit/requirements.txt

      - name: Run Python verification suites
        run: |
          python -m unittest discover -s kinetics
          python -m unittest discover -s evidence
          python NucleusAudit/verify.py
          python research/verify.py

      - name: Verify site build and offline ZIP packaging
        run: |
          python scripts/build_site.py --out /tmp/verify-site
          test -f /tmp/verify-site/index.html
          test -f /tmp/verify-site/customize.html
          test -f /tmp/verify-site/favicon.svg
          test -f /tmp/verify-site/build-info.json
          test -f /tmp/verify-site/assay-evidence-studio.zip
          rm -rf /tmp/verify-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production site, build manifest, and offline ZIP
        run: python scripts/build_site.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
